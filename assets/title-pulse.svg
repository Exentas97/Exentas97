<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="THE PULSE"><title>THE PULSE</title><style>@font-face{font-family:'U';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'M';src:url(data:font/woff;base64,) format('woff');}.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dr 1.6s cubic-bezier(.65,0,.35,1) .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}.tx{animation:up .9s cubic-bezier(.16,1,.3,1) both}@keyframes up{from{transform:translateY(40px);opacity:0}}.dot{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}</style><defs><clipPath id="c"><rect width="1200" height="86"/></clipPath></defs><circle class="dot" cx="6" cy="22" r="4" fill="#2f6bff"/><text x="20" y="27" font-family="M" font-size="13" letter-spacing="2" fill="#2f6bff">(04)</text><g clip-path="url(#c)"><text class="tx" x="0" y="80" font-family="U" font-size="46" letter-spacing="-1.4"><tspan fill="#070b1f">THE </tspan><tspan fill="#1a3dff">PULSE </tspan></text></g><line class="ln" x1="339" y1="68" x2="1200" y2="68" stroke="#2f6bff" stroke-opacity=".35" stroke-width="1.5"/><line x1="0" y1="109" x2="1200" y2="109" stroke="#dfe3ea"/></svg>